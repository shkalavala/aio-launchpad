# Deploys the Next.js static export to GitHub Pages on every push to main.
# Pages must be enabled in repo Settings → Pages → "Build and deployment"
# set to "GitHub Actions" (one-time toggle).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build static export
        env:
          # Project site lives at https://<user>.github.io/aio-launchpad/
          # so every internal link needs the /aio-launchpad prefix.
          NEXT_PUBLIC_BASE_PATH: /aio-launchpad
        run: npm run build
      - name: Disable Jekyll on the output
        run: touch ./out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
